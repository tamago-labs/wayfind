<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfind Logo with Wordmark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Tokyo+Zoo&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0B0F;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-mark {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 80px -20px rgba(59, 130, 246, 0.5);
    }
    .logo-w {
      font-family: 'Zen Tokyo Zoo', sans-serif;
      font-size: 72px;
      color: #FFFFFF;
      transform: rotate(-10deg);
      margin-left: 4px;
      margin-top: 2px;
      line-height: 1;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-mark">
      <span class="logo-w">W</span>
    </div>
    <span class="logo-text">Wayfind</span>
  </div>
</body>
</html>
